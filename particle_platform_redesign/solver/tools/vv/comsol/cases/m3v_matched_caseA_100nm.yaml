schema_version: 1
comparison_id: M3-V-caseA-100nm-deterministic-common-physics-v1
classification: external_comsol_matched_case_diagnostic
claim_policy: within_preregistered_tolerances_only

# This is deliberately a blocked manifest.  It describes the first useful
# matched case and records what the current saved model does, but it must not be
# used to launch COMSOL until every required readiness item is CONFIRMED.  Zero
# tolerances below are fail-closed sentinels, not acceptance budgets.
readiness:
  - name: source_mph_hash_locked
    required: true
    status: CONFIRMED
    evidence: evidence/m3v/mph_hashes.csv; theory model SHA-256 3bbf08e3469758313eac5de473a7a0dd4cc9a6f72c9722393229f0b856e9b524
    reason: Existing M3-V read-only load preserved the source MPH hash.
  - name: source_model_copy_and_no_save_plan_reviewed
    required: true
    status: BLOCKED
    evidence: No deterministic companion run receipt exists.
    reason: The future COMSOL run must use a copy and must never save over the audited source MPH.
  - name: brownian_disabled_in_reference
    required: true
    status: BLOCKED
    evidence: Current particle_physics_feature_settings.csv has bf1 enabled with i=[AS_brownian_seed]; exported Brownian r/z samples are nonzero.
    reason: A deterministic trajectory comparison cannot reuse the current single-seed trajectory.
  - name: common_deterministic_force_set_confirmed
    required: true
    status: BLOCKED
    evidence: Current saved Case A enables ion drag, thermophoresis, lift, DEP, dynamic charge, electric, drag, gravity/buoyancy, and Brownian.
    reason: The first matched case must enable only the explicitly common, independently aligned force set.
  - name: fixed_charge_minus_one_confirmed
    required: true
    status: BLOCKED
    evidence: Current saved model advances the auxq dynamic aggregate charge from AS_Z0=-1.
    reason: The first match freezes charge to isolate field, force, RK4, and boundary behavior.
  - name: candidate_case_checked_through_public_api
    required: true
    status: BLOCKED
    evidence: No candidate case or result hash is registered.
    reason: The candidate must use the normal load_case/simulate/open_result path, not a COMSOL-specific core mode.
  - name: tolerance_budget_preregistered_from_convergence
    required: true
    status: BLOCKED
    evidence: COMSOL self-convergence, candidate self-convergence, and export uncertainty are not yet available.
    reason: Result-dependent tolerance widening is prohibited.
  - name: normalized_comparison_artifacts_exported
    required: true
    status: BLOCKED
    evidence: No field, force, RK-stage, trajectory, or sparse-event artifact is registered below.
    reason: Saved 121-time trajectories do not contain RK stages or an exact sparse event ledger.
  - name: freeze_boundary_mapping_confirmed
    required: true
    status: BLOCKED
    evidence: Current 12 packages contain zero positive Freeze events; boundary 37 is described only as reverse-escape freeze.
    reason: Freeze must not be silently equated with stick or escape without a positive microcase and event ledger.

setting_alignment:
  - name: motion.coordinate_system
    required_value: axisymmetric_rz_no_swirl
    reference_value: axisymmetric_rz_no_swirl
    candidate_value: NOT_CONFIGURED
    reference_evidence: Existing Case A particle model and exported r/z state columns.
    candidate_evidence: Candidate case has not been generated.
  - name: integrator.method
    required_value: classical_rk4_fixed
    reference_value: classical_rk4_fixed
    candidate_value: NOT_CONFIGURED
    reference_evidence: study_and_solver_settings.csv solver_summary integration_method=explicit fixed RK4.
    candidate_evidence: Candidate case has not been generated.
  - name: integrator.fixed_step_s
    required_value: 1.0e-5
    reference_value: 1.0e-5
    candidate_value: NOT_CONFIGURED
    reference_evidence: AS_particle_dt=10 us and solver_summary fixed_step.
    candidate_evidence: Candidate case has not been generated.
  - name: stochastic.brownian
    required_value: disabled
    reference_value: enabled_single_seed_21
    candidate_value: NOT_CONFIGURED
    reference_evidence: bf1 and AS_brownian_seed in current saved model; this must change in the companion copy.
    candidate_evidence: Candidate case has not been generated.
  - name: charge.model
    required_value: fixed_charge_number_minus_one
    reference_value: dynamic_relative_drift_regularized_two_current
    candidate_value: NOT_CONFIGURED
    reference_evidence: auxq.R and AS_Z0=-1 in current saved model; auxq must be disabled in the companion copy.
    candidate_evidence: Candidate case has not been generated.
  - name: deterministic_force_set
    required_value:
      - electric_coulomb_v1
      - epstein_linear_v1_delta_1_plus_0p9_pi_over_8
      - gravity_buoyancy_standard_v1
    reference_value:
      - electric_coulomb_v1
      - epstein_linear_v1_delta_1_plus_0p9_pi_over_8
      - gravity_buoyancy_standard_v1
      - relative_flow_screened_collection_orbital_v1
      - waldmann_thermophoresis_reference
      - free_molecular_lift_sensitivity
      - static_dielectrophoresis
    candidate_value: NOT_CONFIGURED
    reference_evidence: Current feature inventory; extra forces must be disabled in the deterministic companion.
    candidate_evidence: Candidate case has not been generated.
  - name: trajectory.scope
    required_value: pre_first_material_event_or_event_delimited_continuous_segment
    reference_value: NOT_EXPORTED_AS_EVENT_DELIMITED
    candidate_value: NOT_CONFIGURED
    reference_evidence: Current history is a saved-time state table; exact event times are unavailable.
    candidate_evidence: Candidate case has not been generated.
  - name: boundary_mapping
    required_value: explicit_sparse_event_mapping_reviewed
    reference_value: freeze_mapping_unconfirmed
    candidate_value: NOT_CONFIGURED
    reference_evidence: boundary_conditions_and_event_codes.csv and zero observed Freeze events.
    candidate_evidence: Candidate case has not been generated.

