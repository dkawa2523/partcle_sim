    categorical:
      - {name: event_type, reference_column: event_type, candidate_column: event_type}
      - {name: boundary_semantic, reference_column: boundary_semantic, candidate_column: boundary_semantic}
      - {name: outcome, reference_column: outcome, candidate_column: outcome}

accuracy_evidence:
  - name: comsol_time_step_self_convergence
    status: NOT_TESTED
    evidence: No Brownian-off 10/5/2.5 us COMSOL series exists.
    reason: The current single 10 us saved run cannot estimate COMSOL time-discretization error.
  - name: candidate_time_step_self_convergence
    status: NOT_TESTED
    evidence: No matched candidate case exists.
    reason: Candidate RK4 time-discretization error is not yet estimated on the matched case.
  - name: field_mesh_and_export_uncertainty
    status: NOT_TESTED
    evidence: F02 compared one mesh on the same exported nodes only.
    reason: Independent mesh convergence and arbitrary-point COMSOL evaluation uncertainty remain unknown.
  - name: boundary_event_convergence
    status: NOT_TESTED
    evidence: No sparse COMSOL event ledger or Freeze-positive microcase exists.
    reason: Saved output times cannot certify first-hit time or post-event residual-time behavior.
