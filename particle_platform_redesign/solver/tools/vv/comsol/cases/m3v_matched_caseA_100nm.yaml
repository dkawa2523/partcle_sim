    required: true
    artifact: field_probe
    keys:
      - {name: probe_id, reference_column: probe_id, candidate_column: probe_id, kind: text}
    numeric:
      - {name: r, reference_column: r_m, candidate_column: r_m, unit: m, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0}
      - {name: z, reference_column: z_m, candidate_column: z_m, unit: m, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0}
      - {name: gas_velocity_r, reference_column: gas_velocity_r_m_per_s, candidate_column: gas_velocity_r_m_per_s, unit: m/s, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0}
      - {name: gas_velocity_z, reference_column: gas_velocity_z_m_per_s, candidate_column: gas_velocity_z_m_per_s, unit: m/s, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0}
      - {name: gas_temperature, reference_column: gas_temperature_K, candidate_column: gas_temperature_K, unit: K, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 300.0}
      - {name: gas_density, reference_column: gas_density_kg_per_m3, candidate_column: gas_density_kg_per_m3, unit: kg/m^3, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0e-4}
      - {name: electric_field_r, reference_column: electric_field_r_V_per_m, candidate_column: electric_field_r_V_per_m, unit: V/m, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0}
      - {name: electric_field_z, reference_column: electric_field_z_V_per_m, candidate_column: electric_field_z_V_per_m, unit: V/m, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0}
