      - {name: total_acceleration_z, reference_column: acceleration_z_m_per_s2, candidate_column: acceleration_z_m_per_s2, unit: m/s^2, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0}
    categorical: []
  integrator:
    required: true
    artifact: integrator_probe
    keys:
      - {name: particle_id, reference_column: particle_id, candidate_column: particle_id, kind: integer}
      - {name: step_index, reference_column: step_index, candidate_column: step_index, kind: integer}
      - {name: stage, reference_column: stage, candidate_column: stage, kind: text}
