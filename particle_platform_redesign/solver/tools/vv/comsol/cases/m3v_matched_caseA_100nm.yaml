      - {name: electric_z, reference_column: electric_force_z_N, candidate_column: electric_force_z_N, unit: N, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0e-18}
      - {name: epstein_r, reference_column: epstein_force_r_N, candidate_column: epstein_force_r_N, unit: N, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0e-18}
      - {name: epstein_z, reference_column: epstein_force_z_N, candidate_column: epstein_force_z_N, unit: N, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0e-18}
      - {name: gravity_buoyancy_r, reference_column: gravity_buoyancy_force_r_N, candidate_column: gravity_buoyancy_force_r_N, unit: N, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0e-18}
      - {name: gravity_buoyancy_z, reference_column: gravity_buoyancy_force_z_N, candidate_column: gravity_buoyancy_force_z_N, unit: N, absolute_tolerance: 0.0, relative_tolerance: 0.0, scale: 1.0e-18}
