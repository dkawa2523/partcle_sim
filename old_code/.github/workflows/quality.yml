name: quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality-pr:
    name: quality-pr
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install locked quality environment
        run: uv sync --frozen --group quality
      - name: Run pull-request quality gate
        env:
          QUALITY_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --frozen nox -s quality-pr
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-pr-reports
          path: .quality/reports/
          if-no-files-found: warn

  python-310-compatibility:
    name: python-3.10-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install locked quality environment
        run: uv sync --frozen --group quality
      - name: Run compatibility tests
        run: uv run --frozen pytest -q
