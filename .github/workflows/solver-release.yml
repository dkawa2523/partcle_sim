name: solver-release

on:
  pull_request:
    paths:
      - ".github/workflows/solver-release.yml"
      - "particle_platform_redesign/solver/**"
  push:
    paths:
      - ".github/workflows/solver-release.yml"
      - "particle_platform_redesign/solver/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-and-public-api:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
        working-directory: particle_platform_redesign/solver
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up locked uv series
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: particle_platform_redesign/solver/uv.lock
      - name: Synchronize locked development environment
        run: uv sync --locked
      - name: Run standard quality gates
        run: |
          uv lock --check
          uv run --locked ruff format --check src tests tools
          uv run --locked ruff check src tests tools
          uv run --locked pyrefly check --summarize-errors
          uv run --locked lint-imports
          uv run --locked python scripts/check_complexity.py
          uv run --locked python -m pytest tests/verification tests/scenarios -q
      - name: Run producer-neutral Quick Start
        run: |
          $root = Join-Path "${{ runner.temp }}" "chamber-particles-quickstart"
          uv run --locked ruff format --check examples
          uv run --locked ruff check examples
          uv run --locked python examples/quickstart/create_case.py (Join-Path $root "input")
          uv run --locked chamber-particles check (Join-Path $root "input/case.yaml")
          uv run --locked chamber-particles run (Join-Path $root "input/case.yaml") -o (Join-Path $root "result")
          uv run --locked chamber-particles inspect (Join-Path $root "result")
          uv run --locked python -m tools.analysis (Join-Path $root "result") --output (Join-Path $root "derived/summary.json")
          uv run --locked python -m tools.visualization (Join-Path $root "result") --output-directory (Join-Path $root "derived/visualization")
      - name: Run warm performance smoke
        run: |
          $report = Join-Path "${{ runner.temp }}" "p14-smoke.json"
          uv run --locked python -m tests.performance.p14_matrix --suite smoke --json $report
      - name: Build wheel and run clean-install public API smoke
        run: |
          $dist = Join-Path "${{ runner.temp }}" "chamber-particles-dist"
          $runtime = Join-Path "${{ runner.temp }}" "chamber-particles-runtime"
          uv build --wheel --out-dir $dist
          $env:UV_PROJECT_ENVIRONMENT = $runtime
          uv sync --locked --no-dev --no-install-project
          $python = if ($IsWindows) {
            Join-Path $runtime "Scripts/python.exe"
          } else {
            Join-Path $runtime "bin/python"
          }
          $wheel = Get-ChildItem -LiteralPath $dist -Filter "*.whl" -File -ErrorAction Stop
          if ($wheel.Count -ne 1) { throw "expected exactly one wheel" }
          uv pip install --python $python --no-deps $wheel.FullName
          & $python -m tests.release_smoke
      - name: Retain verified release wheel
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chamber-particles-wheel
          path: ${{ runner.temp }}/chamber-particles-dist/*.whl
          if-no-files-found: error
          retention-days: 90

  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheel-and-public-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
      - name: Download verified wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: chamber-particles-wheel
          path: ${{ runner.temp }}/chamber-particles-release
      - name: Verify release identity and prepare checksum
        id: release
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { throw "release tag must start with v" }
          $version = $tag.Substring(1)
          $directory = Join-Path "${{ runner.temp }}" "chamber-particles-release"
          $wheel = @(Get-ChildItem -LiteralPath $directory -Filter "*.whl" -File -ErrorAction Stop)
          if ($wheel.Count -ne 1) { throw "expected exactly one verified wheel" }
          $expectedName = "chamber_particles-$version-py3-none-any.whl"
          if ($wheel[0].Name -ne $expectedName) {
            throw "tag/wheel mismatch: expected $expectedName, found $($wheel[0].Name)"
          }
          $wheelHash = (Get-FileHash -LiteralPath $wheel[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksums = Join-Path $directory "SHA256SUMS.txt"
          [IO.File]::WriteAllText(
            $checksums,
            "$wheelHash  $($wheel[0].Name)`n",
            [Text.UTF8Encoding]::new($false)
          )
          "wheel=$($wheel[0].FullName)" >> $env:GITHUB_OUTPUT
          "checksums=$checksums" >> $env:GITHUB_OUTPUT
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "${{ steps.release.outputs.wheel }}",
            "${{ steps.release.outputs.checksums }}"
          )
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag @assets `
              --repo "${{ github.repository }}" `
              --verify-tag `
              --title "chamber-particles $tag" `
              --notes-file "particle_platform_redesign/solver/RELEASE_NOTES.md"
          }
