name: solver-release

on:
  pull_request:
    paths:
      - ".github/workflows/solver-release.yml"
      - "particle_platform_redesign/solver/**"
  push:
    paths:
      - ".github/workflows/solver-release.yml"
      - "particle_platform_redesign/solver/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-and-public-api:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
        working-directory: particle_platform_redesign/solver
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up locked uv series
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: particle_platform_redesign/solver/uv.lock
      - name: Synchronize locked development environment
        run: uv sync --locked
      - name: Check dependency lock
        run: uv lock --check
      - name: Check source formatting
        run: uv run --locked ruff format --check src tests tools examples scripts
      - name: Check source lint
        run: uv run --locked ruff check src tests tools examples scripts
      - name: Check types
        run: uv run --locked pyrefly check --summarize-errors
      - name: Check import boundaries
        run: uv run --locked lint-imports
      - name: Check numerical complexity
        run: uv run --locked python scripts/check_complexity.py
      - name: Verify core and public scenarios
        run: uv run --locked python -m pytest tests/verification tests/scenarios -q
      - name: Verify external workflows without COMSOL
        run: >-
          uv run --locked python -m pytest tools/comsol_adapter/tests tools/electrostatic_builder/tests tools/field_preprocessor/tests
          tools/vv/comsol/tests/test_meaning_preflight.py tools/vv/comsol/tests/test_boundary_response_mapping.py
          tools/vv/comsol/tests/test_curved_wall_line2_convergence.py tools/vv/comsol/tests/test_prepare_f02_fixed_electric_case.py -q
      - name: Generate producer-neutral Quick Start
        run: |
          $quickstartRoot = Join-Path "${{ runner.temp }}" "chamber-particles-quickstart"
          uv run --locked python examples/quickstart/create_case.py (Join-Path $quickstartRoot "input")
      - name: Check producer-neutral Quick Start
        run: |
          $quickstartRoot = Join-Path "${{ runner.temp }}" "chamber-particles-quickstart"
          uv run --locked chamber-particles check (Join-Path $quickstartRoot "input/case.yaml")
      - name: Run producer-neutral Quick Start
        run: |
          $quickstartRoot = Join-Path "${{ runner.temp }}" "chamber-particles-quickstart"
          uv run --locked chamber-particles run (Join-Path $quickstartRoot "input/case.yaml") -o (Join-Path $quickstartRoot "result")
      - name: Inspect producer-neutral Quick Start
        run: |
          $quickstartRoot = Join-Path "${{ runner.temp }}" "chamber-particles-quickstart"
          uv run --locked chamber-particles inspect (Join-Path $quickstartRoot "result")
      - name: Analyze producer-neutral Quick Start
        run: |
          $quickstartRoot = Join-Path "${{ runner.temp }}" "chamber-particles-quickstart"
          uv run --locked python -m tools.analysis (Join-Path $quickstartRoot "result") --output (Join-Path $quickstartRoot "derived/summary.json")
      - name: Visualize producer-neutral Quick Start
        run: |
          $quickstartRoot = Join-Path "${{ runner.temp }}" "chamber-particles-quickstart"
          uv run --locked python -m tools.visualization (Join-Path $quickstartRoot "result") --output-directory (Join-Path $quickstartRoot "derived/visualization")
      - name: Run warm performance smoke
        run: |
          $report = Join-Path "${{ runner.temp }}" "p14-smoke.json"
          uv run --locked python -m tests.performance.p14_matrix --suite smoke --json $report
      - name: Build release wheel
        run: |
          $wheelDirectory = Join-Path "${{ runner.temp }}" "chamber-particles-dist"
          uv build --wheel --out-dir $wheelDirectory
      - name: Prepare clean runtime dependencies
        run: |
          $runtimeDirectory = Join-Path "${{ runner.temp }}" "chamber-particles-runtime"
          $env:UV_PROJECT_ENVIRONMENT = $runtimeDirectory
          uv sync --locked --no-dev --no-install-project
      - name: Install verified wheel into clean runtime
        run: |
          $wheelDirectory = Join-Path "${{ runner.temp }}" "chamber-particles-dist"
          $runtimeDirectory = Join-Path "${{ runner.temp }}" "chamber-particles-runtime"
          $python = if ($IsWindows) {
            Join-Path $runtimeDirectory "Scripts/python.exe"
          } else {
            Join-Path $runtimeDirectory "bin/python"
          }
          $wheel = @(Get-ChildItem -LiteralPath $wheelDirectory -Filter "*.whl" -File -ErrorAction Stop)
          if ($wheel.Count -ne 1) { throw "expected exactly one wheel" }
          uv pip install --python $python --no-deps $wheel[0].FullName
      - name: Verify clean-installed public API
        run: |
          $wheelDirectory = Join-Path "${{ runner.temp }}" "chamber-particles-dist"
          $wheel = @(Get-ChildItem -LiteralPath $wheelDirectory -Filter "*.whl" -File -ErrorAction Stop)
          if ($wheel.Count -ne 1) { throw "expected exactly one verified wheel" }
          $runtimeDirectory = Join-Path "${{ runner.temp }}" "chamber-particles-runtime"
          $python = if ($IsWindows) {
            Join-Path $runtimeDirectory "Scripts/python.exe"
          } else {
            Join-Path $runtimeDirectory "bin/python"
          }
          $receipt = Join-Path "${{ runner.temp }}" "clean-wheel-smoke.json"
          & $python -m tests.release_smoke --wheel $wheel[0].FullName --json $receipt
      - name: Retain verification evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chamber-particles-verification-${{ runner.os }}
          path: |
            ${{ runner.temp }}/p14-smoke.json
            ${{ runner.temp }}/clean-wheel-smoke.json
            particle_platform_redesign/solver/uv.lock
          if-no-files-found: error
          retention-days: 90
      - name: Retain verified release wheel
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: chamber-particles-wheel
          path: ${{ runner.temp }}/chamber-particles-dist/*.whl
          if-no-files-found: error
          retention-days: 90

  publish-github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheel-and-public-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
      - name: Download verified wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: chamber-particles-wheel
          path: ${{ runner.temp }}/chamber-particles-release
      - name: Verify release identity and prepare checksum
        id: release
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { throw "release tag must start with v" }
          $version = $tag.Substring(1)
          $directory = Join-Path "${{ runner.temp }}" "chamber-particles-release"
          $wheel = @(Get-ChildItem -LiteralPath $directory -Filter "*.whl" -File -ErrorAction Stop)
          if ($wheel.Count -ne 1) { throw "expected exactly one verified wheel" }
          $expectedName = "chamber_particles-$version-py3-none-any.whl"
          if ($wheel[0].Name -ne $expectedName) {
            throw "tag/wheel mismatch: expected $expectedName, found $($wheel[0].Name)"
          }
          $wheelHash = (Get-FileHash -LiteralPath $wheel[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksums = Join-Path $directory "SHA256SUMS.txt"
          [IO.File]::WriteAllText(
            $checksums,
            "$wheelHash  $($wheel[0].Name)`n",
            [Text.UTF8Encoding]::new($false)
          )
          "wheel=$($wheel[0].FullName)" >> $env:GITHUB_OUTPUT
          "checksums=$checksums" >> $env:GITHUB_OUTPUT
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "${{ steps.release.outputs.wheel }}",
            "${{ steps.release.outputs.checksums }}"
          )
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag @assets `
              --repo "${{ github.repository }}" `
              --verify-tag `
              --title "chamber-particles $tag" `
              --notes-file "particle_platform_redesign/solver/RELEASE_NOTES.md"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
