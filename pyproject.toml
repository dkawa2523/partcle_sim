[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "particle-tracer-unified"
version = "0.1.0"
description = "Particle trajectory solver for supplied 2D/3D fields and explicit boundary data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "numba>=0.58",
  "scipy>=1.10"
]

[project.scripts]
particle-tracer-run = "particle_tracer_unified.cli:main"
particle-tracer-field-compare = "particle_tracer_unified.compare.field_compare:main"
particle-tracer-acceleration-compare = "particle_tracer_unified.compare.acceleration_compare:main"
particle-tracer-trajectory-compare = "particle_tracer_unified.compare.trajectory_compare:main"
particle-tracer-boundary-compare = "particle_tracer_unified.compare.boundary_compare:main"
particle-tracer-first-step-compare = "particle_tracer_unified.compare.first_step_compare:main"
particle-tracer-near-wall-nohit = "particle_tracer_unified.compare.near_wall_nohit:main"
particle-tracer-comsol-full-diagnostics = "particle_tracer_unified.compare.comsol_full_diagnostics:main"
particle-tracer-build-comsol-case = "tools.build_comsol_case:main"
particle-tracer-compare-reference = "tools.compare_against_reference:main"
particle-tracer-collect-summaries = "tools.collect_run_summaries:main"
particle-tracer-validate-artifacts = "tools.validate_comparison_artifacts:main"
particle-tracer-export-visualizations = "tools.export_visualizations:main"
particle-tracer-residual-gap-summary = "tools.summarize_comsol_residual_gap:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["particle_tracer_unified*", "tools*"]
