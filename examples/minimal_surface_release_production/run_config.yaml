mode: surface_release_production

run:
  spatial_dim: 2
  coordinate_system: cartesian_xy
  time_interpolation: linear

paths:
  particles_csv: particles.csv
  materials_csv: materials.csv
  part_walls_csv: part_walls.csv

providers:
  geometry:
    kind: box
    bounds: [-1.0, 1.0, -0.5, 0.5]
    grid_shape: [81, 41]
    boundary_part_ids: [102, 103, 104, 101]
  field:
    kind: linear_shear
    shear_rate: 2.0
    dynamic_viscosity_Pas: 1.8e-5
    time_mode: steady

gas:
  temperature_K: 300.0
  dynamic_viscosity_Pas: 1.8e-5
  density_kgm3: 1.2

wall:
  epsilon_offset_m: 1.0e-6

source:
  default_law: explicit_csv
  source_position_offset_m: 0.0
  preprocess:
    enabled: true
    boundary_release: true
    boundary_capture_tolerance_m: 5.0e-4
    boundary_inward_offset_m: 2.0e-6
    normal_velocity_policy: keep

input_contract:
  initial_particle_field_support: strict

provider_contract:
  boundary_field_support: strict
  boundary_offset_cells: 1.0

solver:
  dt: 0.01
  t_end: 0.05
  save_every: 1
  integrator: drag_relaxation
  adaptive_substep_enabled: 0
  adaptive_substep_tau_ratio: 0.5
  adaptive_substep_max_splits: 2
  valid_mask_policy: retry_then_stop
  seed: 202405

output:
  mode: standard
