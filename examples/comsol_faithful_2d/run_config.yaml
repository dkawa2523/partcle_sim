mode: comsol_faithful
comsol:
  manifest: comsol_case_manifest.yaml
run:
  spatial_dim: 2
  coordinate_system: axisymmetric_rz
  time_interpolation: linear
paths: {}
providers:
  geometry:
    kind: precomputed_npz
    npz_path: generated/comsol_geometry_2d.npz
  field:
    kind: precomputed_triangle_mesh_npz
    npz_path: generated/comsol_triangle_field_2d.npz
gas:
  temperature_K: 300.0
  dynamic_viscosity_Pas: 1.8e-5
  density_kgm3: 1.0
  molecular_mass_amu: 39.948
source:
  preprocess:
    enabled: false
solver:
  dt: 1.0e-8
  t_end: 1.0e-6
  save_every: 10
  integrator: etd2
  field_backend_mode: triangle_mesh
  valid_mask_policy: strict_clean
field_support:
  mixed_stencil_policy: error
  ghost_cells:
    enabled: false
output:
  write_collision_diagnostics: true
  write_wall_events: true
